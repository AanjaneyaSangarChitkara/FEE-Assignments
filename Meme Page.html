<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meme Page</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background-color:cadetblue;
        }
        .box{
            width:350px;
            height:500px;
            background-color:rgb(77,141,144);
            border-radius:10%;
            border:2px solid black;
            padding:20px;
            text-align:center;
        }
        p{
            margin-bottom:20px;
            font-size:20px;
            font-weight:bold;
        }
        .memebox{
            width:100%;
            height:400px;
            display:flex;
            justify-content:center;
            align-items:center;
        }
        .memebox img{
            width:100%;
            height:100%;
            object-fit: contain;
            border-radius:10px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <div class="box">
        <p>Click To Change Meme</p>
        <div class="memebox">
            <img id="meme" src="meme1.jpg" alt="Meme">
        </div>
    </div>
    <script src="Meme Page.js"></script>
</body>
</html>
